name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, mypy, ruff, alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Real Postgres/Redis/MinIO via the same docker-compose stack used in
      # local dev (infra/docker/docker-compose.yml) — no separate CI-only
      # service definitions to drift from what's actually run day to day.
      # pytest itself runs against an in-memory SQLite DB (tests/conftest.py)
      # and never touches Postgres, but the api container's own startup
      # (ensure_system_roles/ensure_plan_catalog) queries real tables —
      # on a fresh CI Postgres volume those don't exist yet, so migrations
      # must be applied via a one-off `run` *before* the long-running `api`
      # service starts, or its startup query crashes against an empty
      # schema and it never becomes healthy (verified by dry-running this
      # exact ordering against a throwaway compose project).
      - name: Build the api image
        run: docker compose -f infra/docker/docker-compose.yml build api

      - name: Start Postgres, Redis, MinIO
        run: docker compose -f infra/docker/docker-compose.yml up -d postgres redis minio

      - name: Apply migrations (one-off container, before the api service starts)
        run: docker compose -f infra/docker/docker-compose.yml run --rm api alembic upgrade head

      - name: Verify no schema drift (models match migrations)
        run: docker compose -f infra/docker/docker-compose.yml run --rm api alembic check

      - name: Start the api service
        run: docker compose -f infra/docker/docker-compose.yml up -d api

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.yml exec -T api curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose -f infra/docker/docker-compose.yml logs api
          exit 1

      - name: Run pytest
        run: docker compose -f infra/docker/docker-compose.yml exec -T api python -m pytest -q

      - name: Run mypy
        run: docker compose -f infra/docker/docker-compose.yml exec -T api python -m mypy app

      - name: Run ruff
        run: docker compose -f infra/docker/docker-compose.yml exec -T api python -m ruff check app

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Real full stack — Postgres, Redis, MinIO, the api container, and the
      # web container's own `next dev` — same as local dev. Playwright itself
      # runs from the runner (not inside a container) against the
      # compose-mapped host port, exactly like local dev runs it from the
      # Windows host against the same stack.
      - name: Build the api and web images
        run: docker compose -f infra/docker/docker-compose.yml build api web

      - name: Start Postgres, Redis, MinIO
        run: docker compose -f infra/docker/docker-compose.yml up -d postgres redis minio

      - name: Apply migrations (one-off container, before the api service starts)
        run: docker compose -f infra/docker/docker-compose.yml run --rm api alembic upgrade head

      - name: Start the api and web services
        run: docker compose -f infra/docker/docker-compose.yml up -d api web

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.yml exec -T api curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose -f infra/docker/docker-compose.yml logs api
          exit 1

      - name: Wait for the web dev server to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "Web is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Web did not become ready in time"
          docker compose -f infra/docker/docker-compose.yml logs web
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright's Chromium browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the E2E suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
