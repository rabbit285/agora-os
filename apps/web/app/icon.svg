<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Standalone favicon: colors are literal hex, not var(--brand-*), because
       an icon file is fetched outside any document and has no access to the
       app's CSS custom properties. Keep these in sync with the brand tokens
       in app/globals.css if the palette ever moves. -->
  <defs>
    <linearGradient id="favTeal" x1="6" y1="10" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="favBlue" x1="42" y1="10" x2="20" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <path d="M27.83 31.22A12 12 0 1 1 22.94 12.95" stroke="url(#favTeal)" stroke-width="5.8" stroke-linecap="round"/>
  <path d="M20.17 16.78A12 12 0 1 1 25.06 35.05" stroke="url(#favBlue)" stroke-width="5.8" stroke-linecap="round"/>
  <path d="M24 16.6c.53 4.05 2.8 6.36 6.85 7.4-4.05 1.04-6.32 3.35-6.85 7.4-.53-4.05-2.8-6.36-6.85-7.4 4.05-1.04 6.32-3.35 6.85-7.4Z" fill="#fbbf24"/>
</svg>
