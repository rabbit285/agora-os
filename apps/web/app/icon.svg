<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Standalone favicon: colors are literal hex, not var(--brand-*), because
       an icon file is fetched outside any document and has no access to the
       app's CSS custom properties. Keep these in sync with the brand tokens
       in app/globals.css if the palette ever moves.
       Geometry matches components/logo.tsx — see its comment for why these
       are filled crescents rather than stroked arcs. -->
  <defs>
    <linearGradient id="favTeal" x1="8" y1="12" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="favBlue" x1="40" y1="12" x2="18" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="favSpark" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M25.24 38A15.1 15.1 0 1 0 21.6 12.1L23.39 17.7A9.8 9.8 0 1 1 25.42 32.12Z" fill="url(#favBlue)"/>
  <path d="M22.76 10A15.1 15.1 0 1 0 26.4 35.9L24.61 30.3A9.8 9.8 0 1 1 22.58 15.88Z" fill="url(#favTeal)"/>
  <circle cx="24" cy="24" r="7" fill="url(#favSpark)"/>
  <path d="M24 18.4c.42 3.2 2.18 4.96 5.38 5.38-3.2.42-4.96 2.18-5.38 5.38-.42-3.2-2.18-4.96-5.38-5.38 3.2-.42 4.96-2.18 5.38-5.38Z" fill="#fbbf24"/>
</svg>
